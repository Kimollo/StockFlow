spring:
  application:
    name: stockflow
  datasource:
    url: ${STOCKFLOW_DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${STOCKFLOW_DB_USERNAME:helpdesk}
    password: ${STOCKFLOW_DB_PASSWORD:helpdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

stockflow:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
