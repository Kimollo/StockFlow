spring:
  application:
    name: stockflow
  datasource:
    url: ${STOCKFLOW_DB_URL:jdbc:postgresql://localhost:5432/stockflow_app}
    username: ${STOCKFLOW_DB_USERNAME:helpdesk}
    password: ${STOCKFLOW_DB_PASSWORD:helpdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

stockflow:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  jwt:
    secret: ${STOCKFLOW_JWT_SECRET:stockflow-dev-signing-key-change-before-deploy}
    ttl-hours: 12
  admin:
    name: Shop owner
    username: ${STOCKFLOW_ADMIN_USERNAME:admin}
    password: ${STOCKFLOW_ADMIN_PASSWORD:stockflow}
